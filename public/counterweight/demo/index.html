<body>

<!-- The design platform: its canvas, what it draws over it, and its own controls. -->
<div class="stage" id="stage">
  <div class="pins" id="pins"></div>
  <svg class="lead" id="lead" aria-hidden="true"><line id="lead-l"/><circle id="lead-d" r="4"/></svg>
  <div class="callout" id="callout" hidden></div>
</div>

<!-- Counterweight, mounted over it. -->
<div id="ui"></div>

<div class="dock glass" id="dock">
  <button type="button" class="on" title="Select"><i class="ph ph-cursor"></i></button>
  <button type="button" title="Orbit · right drag"><i class="ph ph-cube-focus"></i></button>
  <button type="button" title="Pan · middle drag"><i class="ph ph-hand-grabbing"></i></button>
  <button type="button" id="home" title="Fit all  F"><i class="ph ph-corners-out"></i></button>
  <span class="div"></span>
  <button type="button" title="Sun study (soon)" disabled><i class="ph ph-sun"></i></button>
  <button type="button" title="Section (soon)" disabled><i class="ph ph-square-split-vertical"></i></button>
  <span class="div"></span>
  <button type="button" id="add-ifc" title="Add an IFC file as an option"><i class="ph ph-file-plus"></i></button>
  <input type="file" id="ifc-file" accept=".ifc" hidden>
  <button type="button" class="demo" id="demo-edit" title="Simulate an edit made in the design platform"><span class="dt">Demo</span>Edit model</button>
</div>

</body>
</html>
